<!doctype html><html><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Fisch Values</title><style>body{font-family:Inter,system-ui;background:#0d0e10;color:#e5e7eb;margin:0}header{padding:12px 16px;border-bottom:1px solid #2a2c32;background:#141518;display:flex;gap:10px;align-items:center}.layout{display:block;min-height:calc(100vh - 58px)}.btn,input,select{background:#1a1c20;color:#e5e7eb;border:1px solid #2a2c32;border-radius:8px;padding:8px 10px}.main{padding:14px}.card{background:#141518;border:1px solid #2a2c32;border-radius:12px;padding:12px;margin-bottom:14px}table{width:100%;border-collapse:collapse;background:#141518;border:1px solid #2a2c32}th,td{padding:10px;border-bottom:1px solid #24262d;text-align:left}th{cursor:pointer;color:#cbd5e1}tr:hover{background:#1b1f26}.qrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #24262d}.ok{color:#4ade80}.warn{color:#fbbf24}</style></head><body><header><b>Fisch Value Table</b><input id='q' placeholder='Search item...'/><select id='typeFilter'><option value='all'>All Types</option><option value='Relics'>Relics</option><option value='Set'>Set</option><option value='Skins'>Skins</option><option value='Boats'>Boats</option></select><select id='sort'><option value='item_asc'>Item A-Z</option><option value='item_desc'>Item Z-A</option><option value='value_desc'>Value High-Low</option><option value='value_asc'>Value Low-High</option></select><a class='btn' href='/'>Back to Deck</a></header><div class='layout'><main class='main'><div class='card'><h3 style='margin-top:0'>Quest / Inventory Tracker</h3><div id='quests'></div></div><div class='card'><h3 style='margin-top:0'>Value List</h3><table><thead><tr><th>Item</th><th>Type</th><th>Value</th><th>Note</th></tr></thead><tbody id='tb'></tbody></table></div></main></div><script>let rows=[];const fmt=n=>`S$ ${(Number(n||0)/100000).toLocaleString('en-US',{maximumFractionDigits:2})}`;
const inferType=(name='')=>{const n=name.toLowerCase();if(n.includes('relic')||['moonstone','malevolence'].some(x=>n.includes(x)))return 'Relics';if(n.includes('dutchman')||n.includes('sled'))return 'Boats';if(n.includes('catness')||n.includes('scissors')||n.includes('flip')||n.includes('phone'))return 'Skins';return 'Set';};
function render(){const q=document.getElementById('q').value.toLowerCase().trim();const t=document.getElementById('typeFilter').value;const s=document.getElementById('sort').value;let data=rows.map(r=>({...r,type:r.type||inferType(r.item)})).filter(r=>r.item.toLowerCase().includes(q) && (t==='all'||r.type===t));if(s==='item_asc')data.sort((a,b)=>a.item.localeCompare(b.item));if(s==='item_desc')data.sort((a,b)=>b.item.localeCompare(a.item));if(s==='value_desc')data.sort((a,b)=>b.value-a.value);if(s==='value_asc')data.sort((a,b)=>a.value-b.value);document.getElementById('tb').innerHTML=data.map(r=>`<tr><td>${r.item}</td><td>${r.type}</td><td>${fmt(r.value)}</td><td>${r.note||''}</td></tr>`).join('');}
const QUESTS=[{name:'Onirifalx Set Rod',items:['Charred Booth','SSWFloppy','Wrath Scylla']},{name:'Wind Elemental Rod Set',items:['Shiny Big Bait Crate','Shiny Kings Blessing Pufferfish','Shiny Blessed Whale Shark']}];
const own=JSON.parse(localStorage.getItem('fisch.ownedItems.v1')||'{}');
const qOpen=JSON.parse(localStorage.getItem('fisch.questOpen.v1')||'{}');
const saveOwn=()=>localStorage.setItem('fisch.ownedItems.v1',JSON.stringify(own));
const saveOpen=()=>localStorage.setItem('fisch.questOpen.v1',JSON.stringify(qOpen));
function setQuestDone(q,done){q.items.forEach(it=>own[it]=!!done);saveOwn();renderQuests();}
function renderQuests(){const root=document.getElementById('quests');root.innerHTML='';QUESTS.forEach(q=>{const wrap=document.createElement('div');wrap.style.marginBottom='10px';const done=q.items.every(i=>own[i]);const head=document.createElement('div');head.className='qrow';const title=document.createElement('button');title.className='btn';title.style.fontWeight='700';title.textContent=(qOpen[q.name]?'▾ ':'▸ ')+q.name;title.onclick=()=>{qOpen[q.name]=!qOpen[q.name];saveOpen();renderQuests();};const btn=document.createElement('button');btn.className='btn '+(done?'ok':'warn');btn.textContent=done?'Complete':'In progress';btn.onclick=()=>setQuestDone(q,!done);head.append(title,btn);wrap.appendChild(head);if(qOpen[q.name]){q.items.forEach(it=>{const row=document.createElement('div');row.className='qrow';const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!own[it];cb.onchange=()=>{own[it]=cb.checked;saveOwn();renderQuests();};const left=document.createElement('div');left.style.display='flex';left.style.gap='8px';left.style.alignItems='center';left.append(cb,document.createTextNode(it));row.append(left);wrap.appendChild(row);});}root.appendChild(wrap);});}
fetch('/data/values.json').then(r=>r.json()).then(d=>{rows=d;render();renderQuests();});document.getElementById('q').addEventListener('input',render);document.getElementById('typeFilter').addEventListener('change',render);document.getElementById('sort').addEventListener('change',render);</script></body></html>
