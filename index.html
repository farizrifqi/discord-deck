<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiscordDeck</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d0e10; color: #e5e7eb; font-family: Inter, system-ui, sans-serif; }
    header { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #141518; border-bottom: 1px solid #2a2c32; }
    .logo { font-weight: 700; font-size: 18px; margin-right: 12px; }
    .status-pill { display: flex; align-items: center; gap: 6px; border: 1px solid #2a2c32; background: #1a1c20; color: #e5e7eb; border-radius: 999px; padding: 4px 12px; font-size: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
    .status-pill.connected .status-dot { background: #22c55e; }
    .status-pill.disconnected .status-dot, .status-pill.error .status-dot { background: #ef4444; }
    .right { margin-left: auto; display: flex; gap: 8px; }
    .btn { border: 1px solid #2a2c32; background: #1a1c20; color: #e5e7eb; border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
    .btn:hover { background: #25282f; }
    .main { height: calc(100vh - 56px); display: flex; }
    #wrap { flex: 1; display: flex; gap: 12px; overflow-x: auto; padding: 16px; }
    .col { width: 340px; min-width: 340px; background: #141518; border: 1px solid #2a2c32; border-radius: 12px; display: flex; flex-direction: column; }
    .colh { padding: 12px; border-bottom: 1px solid #2a2c32; display: flex; align-items: center; gap: 8px; cursor: grab; }
    .title { font-weight: 600; flex: 1; }
    .count { font-size: 12px; color: #9ca3af; }
    .list { flex: 1; overflow-y: auto; padding: 8px; }
    .card { background: #1b1f26; border: 1px solid #2a2c32; border-radius: 8px; padding: 10px; margin-bottom: 8px; font-size: 13px; }
    .card-actions { margin-top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
    .card-actions button { font-size: 11px; padding: 3px 8px; border-radius: 5px; border: 1px solid #2a2c32; background: #1a1c20; color: #e5e7eb; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal.open { display: flex; }
    .modal-content { background: #1a1c20; border: 1px solid #2a2c32; border-radius: 12px; width: 440px; max-height: 80vh; overflow: auto; }
    .modal-header { padding: 14px 18px; border-bottom: 1px solid #2a2c32; font-weight: 600; }
    .modal-body { padding: 16px; }
    select, input { width: 100%; padding: 8px; background: #0f1318; border: 1px solid #2a2c32; color: #e5e7eb; border-radius: 6px; margin-bottom: 10px; }
    .channel-list { max-height: 180px; overflow-y: auto; border: 1px solid #2a2c32; border-radius: 6px; padding: 8px; background: #0f1318; }
  </style>
</head>
<body>
  <header>
    <div class="logo">DiscordDeck</div>
    <div id="nav-status" class="status-pill"><div class="status-dot"></div><span id="nav-status-text">connecting</span></div>
    <div class="right">
      <button id="add" class="btn">+ Keyword</button>
      <button id="btn-blacklist" class="btn">Blacklist</button>
      <button id="btn-favorites" class="btn">Favorites</button>
      <button id="btn-clear-hidden" class="btn">Clear Hidden</button>
    </div>
  </header>

  <div class="main">
    <div id="wrap"></div>
  </div>

  <!-- Add Keyword Modal -->
  <div id="add-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">Add Keyword</div>
      <div class="modal-body">
        <input id="kw-input" placeholder="Keyword" />
        <div>
          <label style="font-size:12px;color:#9ca3af">Guild</label>
          <select id="guild-select"></select>
        </div>
        <div id="channel-section" style="margin-top:12px">
          <label style="font-size:12px;color:#9ca3af">Channels</label>
          <div id="channel-list" class="channel-list"></div>
        </div>
        <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">
          <button id="cancel-add" class="btn">Cancel</button>
          <button id="confirm-add" class="btn">Add Keyword</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let ws, keywords = [], keywordConfigs = {}, columns = {}, guilds = {}, blacklistByKeyword = {}, favorites = {}, hidden = new Set();

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onopen = () => {
        document.getElementById('nav-status').className = 'status-pill connected';
        document.getElementById('nav-status-text').textContent = 'connected';
        ws.send(JSON.stringify({ type: 'resync' }));
      };

      ws.onclose = () => {
        document.getElementById('nav-status').className = 'status-pill disconnected';
        document.getElementById('nav-status-text').textContent = 'disconnected';
        setTimeout(connect, 2000);
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        handleMessage(data);
      };
    }

    function handleMessage(data) {
      if (data.type === 'init') {
        keywords = data.keywords || [];
        keywordConfigs = data.keywordConfigs || {};
        columns = data.columns || {};
        guilds = data.guilds || {};
        blacklistByKeyword = data.blacklistByKeyword || {};
        renderColumns();
      }
      if (data.type === 'message') {
        queueMessage(data);
      }
      if (data.type === 'keyword_added' || data.type === 'keyword_removed') {
        if (data.keywords) keywords = data.keywords;
        if (data.keywordConfigs) keywordConfigs = data.keywordConfigs;
        renderColumns();
      }
      if (data.type === 'guilds_updated') {
        guilds = data.guilds || guilds;
      }
    }

    function renderColumns() {
      const wrap = document.getElementById('wrap');
      wrap.innerHTML = '';
      keywords.forEach(kw => {
        const col = createColumn(kw);
        wrap.appendChild(col);
      });
    }

    function createColumn(kw) {
      const col = document.createElement('div');
      col.className = 'col';
      col.draggable = true;
      col.dataset.kw = kw;

      col.innerHTML = `
        <div class="colh">
          <div class="title">${kw}</div>
          <div class="count">${(columns[kw] || []).length}/30</div>
          <button class="btn" style="padding:1px 8px;font-size:12px" onclick="removeKeyword('${kw}')">×</button>
        </div>
        <div class="list"></div>
      `;

      const list = col.querySelector('.list');
      (columns[kw] || []).forEach(msg => list.appendChild(createMessageCard(msg, kw)));

      // Drag & Drop
      col.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', kw));
      col.addEventListener('dragover', e => e.preventDefault());
      col.addEventListener('drop', e => {
        e.preventDefault();
        const from = e.dataTransfer.getData('text/plain');
        const to = kw;
        if (from !== to) {
          const i1 = keywords.indexOf(from);
          const i2 = keywords.indexOf(to);
          keywords.splice(i2, 0, keywords.splice(i1, 1)[0]);
          renderColumns();
        }
      });
      return col;
    }

    function createMessageCard(msg, kw) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div><strong>${msg.author?.displayName || msg.author?.username}</strong></div>
        <div style="margin-top:4px">${msg.content}</div>
        <div style="font-size:11px;color:#9ca3af;margin-top:6px">${msg.guild?.name || ''} • ${msg.channel?.name || ''}</div>
        <div class="card-actions">
          <button onclick="toggleFavorite(${JSON.stringify(msg.author)})">★</button>
          <button onclick="hideMessage('${msg.id}', this)">Hide</button>
          <button onclick="blockUser('${kw}', ${JSON.stringify(msg.author)})">Block</button>
          <button onclick="copyMessage(this)">Copy</button>
        </div>
      `;
      return card;
    }

    function toggleFavorite(user) {
      if (!user?.id) return;
      favorites[user.id] ? delete favorites[user.id] : favorites[user.id] = user;
      renderColumns();
    }

    function hideMessage(id, btn) {
      hidden.add(id);
      btn.closest('.card').remove();
    }

    function blockUser(kw, user) {
      if (!user?.id) return;
      ws.send(JSON.stringify({ type: 'blacklist_user', keyword: kw, user }));
    }

    function copyMessage(btn) {
      const text = btn.closest('.card').innerText;
      navigator.clipboard.writeText(text);
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 1000);
    }

    function queueMessage(msg) {
      (msg.keywords || []).forEach(kw => {
        if (!keywords.includes(kw)) return;
        columns[kw] = columns[kw] || [];
        columns[kw].unshift(msg);
        if (columns[kw].length > 30) columns[kw].pop();
      });
      renderColumns();
    }

    function removeKeyword(kw) {
      if (!confirm(`Remove "${kw}"?`)) return;
      ws.send(JSON.stringify({ type: 'remove_keyword', keyword: kw }));
    }

    // Add Keyword Modal
    function openAddModal() {
      const modal = document.getElementById('add-modal');
      const guildSelect = document.getElementById('guild-select');
      const channelList = document.getElementById('channel-list');

      modal.style.display = 'flex';
      guildSelect.innerHTML = '';
      channelList.innerHTML = '';

      Object.values(guilds).forEach(g => {
        const opt = document.createElement('option');
        opt.value = g.id;
        opt.textContent = g.name;
        guildSelect.appendChild(opt);
      });

      if (Object.keys(guilds).length > 0) {
        updateChannelList();
      } else {
        channelList.innerHTML = '<div style="color:#9ca3af">No guilds yet</div>';
      }

      guildSelect.onchange = updateChannelList;

      function updateChannelList() {
        const gid = guildSelect.value;
        channelList.innerHTML = '';
        const g = guilds[gid];
        if (!g) return;
        Object.values(g.channels || {}).forEach(ch => {
          const div = document.createElement('div');
          div.innerHTML = `<input type="checkbox" value="${ch.id}" checked> ${ch.name}`;
          channelList.appendChild(div);
        });
      }

      document.getElementById('confirm-add').onclick = () => {
        const kw = document.getElementById('kw-input').value.trim().toLowerCase();
        if (!kw) return;
        const gid = guildSelect.value || null;
        const channels = Array.from(channelList.querySelectorAll('input:checked')).map(el => el.value);
        ws.send(JSON.stringify({ type: 'add_keyword', keyword: kw, guildId: gid, channels }));
        modal.style.display = 'none';
        document.getElementById('kw-input').value = '';
      };

      document.getElementById('cancel-add').onclick = () => modal.style.display = 'none';
    }

    // Event listeners
    document.getElementById('add').onclick = openAddModal;
    document.getElementById('btn-blacklist').onclick = () => alert('Blacklist modal');
    document.getElementById('btn-favorites').onclick = () => alert('Favorites modal');
    document.getElementById('btn-clear-hidden').onclick = () => { hidden.clear(); renderColumns(); };

    // Horizontal scroll with wheel
    document.getElementById('wrap').addEventListener('wheel', function(e) {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        this.scrollLeft += e.deltaY;
        e.preventDefault();
      }
    }, { passive: false });

    connect();
  </script>
</body>
</html>
