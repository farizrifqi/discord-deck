<!doctype html><html><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>DiscordDeck</title><style>*{box-sizing:border-box}body{margin:0;background:#0d0e10;color:#e5e7eb;font-family:Inter,system-ui}header{height:56px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#141518;border-bottom:1px solid #2a2c32}.status-pill{display:flex;align-items:center;gap:6px;border:1px solid #2a2c32;background:#1a1c20;color:#e5e7eb;border-radius:999px;padding:3px 9px;font-size:12px}.status-dot{width:7px;height:7px;border-radius:50%;background:#6b7280}.status-pill.connected .status-dot{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.5)}.status-pill.disconnected .status-dot,.status-pill.error .status-dot{background:#ef4444;box-shadow:0 0 8px rgba(239,68,68,.5)}
.right{margin-left:auto;display:flex;gap:8px;position:relative;align-items:center}.btn{border:1px solid #2a2c32;background:#1a1c20;color:#e5e7eb;border-radius:10px;padding:6px 10px;cursor:pointer;text-decoration:none}.main{height:calc(100vh - 56px);display:flex;position:relative}.leftbar{width:56px;background:#141518;border-right:1px solid #2a2c32;padding:10px;display:flex;align-items:flex-start;justify-content:center}.left-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid #2a2c32;background:#1a1c20;color:#cbd5e1;border-radius:10px;text-decoration:none;font-size:18px}.left-icon:hover{border-color:#394150;background:#1b1f26}#wrap{flex:1;display:flex;gap:10px;overflow:auto;padding:10px;position:relative;scrollbar-width:thin;scrollbar-color:#4b5563 transparent}#wrap::-webkit-scrollbar{width:10px;height:10px}#wrap::-webkit-scrollbar-track{background:transparent}#wrap::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#4b5563,#374151);border-radius:999px;border:2px solid transparent;background-clip:padding-box}#wrap::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#6b7280,#4b5563)}.col{width:360px;min-width:360px;height:100%;display:flex;flex-direction:column;border:1px solid #2a2c32;border-radius:12px;background:#141518;position:relative}
.wrap-overlay{position:absolute;inset:0;z-index:999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(1px)}
.wrap-overlay.show{display:flex}
.wrap-overlay .ov-card{display:flex;align-items:center;gap:10px;background:#111317;border:1px solid #2a2c32;color:#e5e7eb;padding:14px 18px;border-radius:12px;font-size:14px;font-weight:600}
.spin{width:14px;height:14px;border:2px solid #334155;border-top-color:#93c5fd;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}.col.dragging{opacity:.6}.colh{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid #2a2c32}.title{flex:1;font-weight:700}.count{font-size:12px;color:#9ca3af}.list{flex:1;overflow:auto;padding:8px;position:relative;scrollbar-width:thin;scrollbar-color:#4b5563 transparent}.list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-track{background:transparent}.list::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#4b5563,#374151);border-radius:999px;border:2px solid transparent;background-clip:padding-box}.list::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#6b7280,#4b5563)}.list .top-shadow{position:sticky;top:-8px;left:0;right:0;height:32px;z-index:5;pointer-events:none;margin:0 -8px 0 -8px;background:linear-gradient(180deg,rgba(0,0,0,.72),rgba(0,0,0,.28) 55%,rgba(0,0,0,0));border-top-left-radius:10px;border-top-right-radius:10px;opacity:0;transition:opacity .18s ease}.list.show-shadow .top-shadow{opacity:1}.new-pill{display:none;position:sticky;top:2px;z-index:6;background:#1e293b;border:1px solid #334155;color:#bfdbfe;padding:4px 8px;border-radius:8px;font-size:11px;margin:0 0 8px 0;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.35)}.card{border:1px solid #2a2c32;background:linear-gradient(180deg,#1b1f26,#171a20);border-radius:10px;padding:10px;margin-bottom:8px}.card.fav{border-color:#3b82f6;box-shadow:0 0 0 1px #1d4ed8 inset}.body{margin-top:8px;font-size:13px;line-height:1.45;word-break:break-word}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:11px;padding:4px 8px;border-radius:8px}.pop{display:none;position:absolute;right:10px;top:44px;width:300px;background:#12161d;border:1px solid #394150;border-radius:12px;padding:10px;z-index:20}.pop.open{display:block}.search{width:100%;padding:6px 8px;border-radius:8px;border:1px solid #394150;background:#0f1318;color:#e5e7eb;margin:6px 0}.chlist{max-height:150px;overflow:auto;border:1px solid #2a2c32;border-radius:8px;padding:6px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center}.modal.open{display:flex}.modalcard{width:min(720px,92vw);max-height:80vh;overflow:auto;background:#141518;border:1px solid #2a2c32;border-radius:12px;padding:12px}.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #2a2c32}</style></head><body><header><b>Discord<span style='color:#6366f1'>Deck</span></b><div id='nav-status' class='status-pill disconnected'><span class='status-dot'></span><span id='nav-status-text'>disconnected</span></div><span id='health' style='font-size:11px;color:#9ca3af'></span><div class='right'><button id='btn-clear-hidden' class='btn'>Clear hidden</button><button id='btn-favorites' class='btn'>Favorited users</button><button id='btn-blacklist' class='btn'>Blocked users</button><select id='guild-select' class='btn' title='Guild'></select><button id='add-channel-toggle' class='btn' title='Channels'>Channels</button><div id='add-channel-pop' class='pop'><input id='add-channel-search' class='search' placeholder='Search channels'/><div id='add-channel-list' class='chlist'></div><div style='display:flex;gap:6px;margin-top:8px'><button id='add-channel-all' class='btn'>All</button><button id='add-channel-clear' class='btn'>Clear</button></div></div><input id='kw' class='btn' style='width:180px;text-align:left' placeholder='add keyword'/><button id='add' class='btn' style='background:#6366f1'>+</button></div></header><div class='main'><aside class='leftbar'><a class='left-icon' href='/values.html' title='Values'>&#128220;</a></aside><div id='wrap'><div id='wrap-overlay' class='wrap-overlay'><div class='ov-card'><span class='spin'></span><span id='ov-text'>Reconnecting...</span></div></div></div></div><div id='modal' class='modal'><div class='modalcard'><div style='display:flex;justify-content:space-between'><b>Blocked users by keyword</b><button id='close-modal' class='btn'>Close</button></div><div id='mcontent'></div></div></div><div id='fav-modal' class='modal'><div class='modalcard'><div style='display:flex;justify-content:space-between'><b>Favorited users</b><button id='close-fav-modal' class='btn'>Close</button></div><div id='fav-content'></div></div></div><script>let keywords = [];
let keywordConfigs = {};
let channelsSeen = [];
let guilds = {};
let blacklistByKeyword = {};
let columns = {};

const FAV_COL = '__favorites__';
const favorites = JSON.parse(localStorage.getItem('discorddeck.favorites.v1') || '{}');
const hidden = new Set(JSON.parse(localStorage.getItem('discorddeck.hiddenMessageIds.v1') || '[]'));
let order = JSON.parse(localStorage.getItem('discorddeck.columnOrder.v1') || '[]');
let ws;
let retry = 1000;
let timer = null;
const pending = new Map();
const newCount = {};

const wrap = document.getElementById('wrap');
const overlay = document.getElementById('wrap-overlay');
const ovText = document.getElementById('ov-text');
const navStatus = document.getElementById('nav-status');
const navStatusText = document.getElementById('nav-status-text');
const guildSelect = document.getElementById('guild-select');
const addChannelPop = document.getElementById('add-channel-pop');
const addChannelList = document.getElementById('add-channel-list');

const saveFav = () => localStorage.setItem('discorddeck.favorites.v1', JSON.stringify(favorites));
const saveHidden = () => localStorage.setItem('discorddeck.hiddenMessageIds.v1', JSON.stringify([...hidden]));
const saveOrder = () => localStorage.setItem('discorddeck.columnOrder.v1', JSON.stringify(order));
const send = (payload) => ws && ws.readyState === 1 && ws.send(JSON.stringify(payload));
const esc = (value) => String(value || '').replace(/[&<>]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
const attr = (value) => esc(value).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const md = (value) => esc(value || '')
  .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
  .replace(/`([^`\n]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
  .replace(/\*([^*\n]+)\*/g, '<i>$1</i>')
  .replace(/(https?:\/\/[^\s<]+)/g, '<a class="btn chip" href="$1" target="_blank">$1</a>')
  .replace(/\n/g, '<br/>');

function setNavStatus(status) {
  navStatus.className = 'status-pill ' + status;
  navStatusText.textContent = status;
}

function showOverlay(text) {
  ovText.textContent = text || 'Reconnecting...';
  overlay.classList.add('show');
}

function hideOverlay() {
  overlay.classList.remove('show');
}

function byName(a, b) {
  return String(a.name || a.id || '').localeCompare(String(b.name || b.id || ''), undefined, { sensitivity: 'base' });
}

function guildList() {
  return Object.values(guilds || {}).sort(byName);
}

function selectedGuildId() {
  return guildSelect?.value || '';
}

function channelsForGuild(guildId) {
  return guildId && guilds?.[guildId]?.channels ? Object.values(guilds[guildId].channels).sort(byName) : [];
}

function upsertChannelSeen(channel) {
  if (!channel?.id) return;
  const id = String(channel.id);
  const name = String(channel.name || 'unknown');
  const existing = channelsSeen.find((c) => String(c.id) === id);
  if (existing) existing.name = name;
  else channelsSeen.push({ id, name });
}

function upsertGuildSeen(guild, channel) {
  if (!guild?.id) return;
  const id = String(guild.id);
  const record = guilds[id] || { id, name: String(guild.name || 'Unknown Guild'), channels: {} };
  record.name = String(guild.name || record.name || 'Unknown Guild');
  record.channels = record.channels || {};

  Object.values(guild.channels || {}).forEach((c) => {
    if (c?.id) record.channels[String(c.id)] = { id: String(c.id), name: String(c.name || 'unknown') };
  });

  if (channel?.id) {
    record.channels[String(channel.id)] = { id: String(channel.id), name: String(channel.name || 'unknown') };
  }

  guilds[id] = record;
}

function channelCheckboxHtml(channels, selected = []) {
  const selectedSet = new Set((selected || []).map(String));
  if (!channels.length) return `<div style='color:#888'>No channels seen for this guild yet</div>`;
  return channels.map((channel) => `
    <label style='display:flex;gap:6px'>
      <input class='ch' type='checkbox' value='${attr(channel.id)}' ${selectedSet.has(String(channel.id)) ? 'checked' : ''}/>
      #${esc(channel.name || channel.id)}
    </label>`).join('');
}

function renderAddChannels() {
  if (!addChannelList) return;
  const selected = [...addChannelList.querySelectorAll('.ch:checked')].map((input) => input.value);
  const guildId = selectedGuildId();
  addChannelList.innerHTML = guildId
    ? channelCheckboxHtml(channelsForGuild(guildId), selected)
    : `<div style='color:#888'>Select a guild first</div>`;
}

function renderGuildSelect() {
  if (!guildSelect) return;
  const previous = guildSelect.value;
  const list = guildList();
  guildSelect.disabled = list.length === 0;

  if (!list.length) {
    guildSelect.innerHTML = `<option value=''>No guilds seen</option>`;
    renderAddChannels();
    return;
  }

  const next = list.some((guild) => String(guild.id) === String(previous)) ? String(previous) : String(list[0].id);
  guildSelect.innerHTML = list.map((guild) => (
    `<option value='${attr(guild.id)}' ${String(guild.id) === next ? 'selected' : ''}>${esc(guild.name || guild.id)}</option>`
  )).join('');
  guildSelect.value = next;
  renderAddChannels();
}

function addKeywordWithGuild() {
  const rawKeyword = prompt("Keyword:");
  const keyword = rawKeyword?.trim().toLowerCase();
  if (!keyword) return;

  const guildEntries = Object.values(guilds || {});
  if (!guildEntries.length) {
    send({ type: 'add_keyword', keyword, channels: [] });
    return;
  }

  const guildId = prompt("Guild:\n" + guildEntries.map((guild) => `${guild.id} - ${guild.name || guild.id}`).join("\n"));
  if (!guildId) return;

  const channelMap = guildEntries.find((guild) => String(guild.id) === String(guildId))?.channels || {};
  const channelEntries = Object.values(channelMap);
  const channelInput = prompt("Channels (comma IDs):\n" + channelEntries.map((channel) => `${channel.id} - ${channel.name || channel.id}`).join("\n"));
  const channels = channelInput ? channelInput.split(',').map((id) => id.trim()).filter(Boolean) : [];

  send({ type: 'add_keyword', keyword, guildId, channels });
}

function ensureFav() {
  if (!keywords.includes(FAV_COL)) keywords.unshift(FAV_COL);
  if (!keywordConfigs[FAV_COL]) keywordConfigs[FAV_COL] = { channels: [], caseSensitive: false, showBlacklisted: true };
  if (!columns[FAV_COL]) columns[FAV_COL] = [];
}

function ensureOrder() {
  ensureFav();
  const set = new Set(keywords);
  order = order.filter((kw) => set.has(kw));
  keywords.forEach((kw) => { if (!order.includes(kw)) order.push(kw); });
  saveOrder();
}

function isBlocked(keyword, userId) {
  return !!blacklistByKeyword?.[keyword]?.[userId];
}

function toggleFavorite(user) {
  if (!user?.id) return;
  if (favorites[user.id]) delete favorites[user.id];
  else favorites[user.id] = { id: user.id, username: user.username || '', displayName: user.displayName || user.username || user.id };
  saveFav();
  renderFavModal();
  renderColumns();
}

function renderFavModal() {
  const box = document.getElementById('fav-content');
  box.innerHTML = '';
  const users = Object.values(favorites);
  const top = document.createElement('div');
  top.style.cssText = 'display:flex;justify-content:flex-end;margin:8px 0';

  if (users.length) {
    const button = document.createElement('button');
    button.className = 'btn';
    button.textContent = 'Unfavorite all';
    button.onclick = () => {
      Object.keys(favorites).forEach((key) => delete favorites[key]);
      saveFav();
      renderFavModal();
      renderColumns();
    };
    top.appendChild(button);
  }

  box.appendChild(top);
  if (!users.length) {
    box.append('No favorites yet');
    return;
  }

  users.forEach((user) => {
    const row = document.createElement('div');
    row.className = 'row';
    const name = document.createElement('span');
    name.textContent = user.displayName || user.username || user.id;
    const button = document.createElement('button');
    button.className = 'btn';
    button.textContent = 'Unfavorite';
    button.onclick = () => toggleFavorite(user);
    row.append(name, button);
    box.appendChild(row);
  });
}

function renderModal() {
  const box = document.getElementById('mcontent');
  box.innerHTML = '';

  for (const keyword of keywords) {
    const users = Object.values(blacklistByKeyword[keyword] || {});
    const section = document.createElement('div');
    const head = document.createElement('div');
    head.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin:8px 0';
    head.innerHTML = `<h4>${esc(keyword)} (${users.length})</h4>`;

    if (users.length) {
      const button = document.createElement('button');
      button.className = 'btn';
      button.textContent = 'Unblock all';
      button.onclick = () => users.forEach((user) => send({ type: 'unblacklist_user', keyword, user: { id: user.id } }));
      head.appendChild(button);
    }

    section.appendChild(head);
    if (!users.length) {
      const none = document.createElement('div');
      none.style.color = '#888';
      none.textContent = 'None';
      section.appendChild(none);
    }

    users.forEach((user) => {
      const row = document.createElement('div');
      row.className = 'row';
      const name = document.createElement('span');
      name.textContent = user.displayName || user.username || user.id;
      const button = document.createElement('button');
      button.className = 'btn';
      button.textContent = 'Unblock';
      button.onclick = () => send({ type: 'unblacklist_user', keyword, user: { id: user.id } });
      row.append(name, button);
      section.appendChild(row);
    });

    box.appendChild(section);
  }
}

function card(message, keyword) {
  const fav = !!favorites[message.author?.id];
  const blocked = isBlocked(keyword, message.author?.id);
  const node = document.createElement('div');
  node.className = 'card' + (fav ? ' fav' : '');
  const timestamp = new Date(message.timestamp || Date.now());
  const rel = ((Date.now() - timestamp) / 60000) | 0;

  node.innerHTML = `
    <div style='display:flex;justify-content:space-between;font-size:12px'>
      <div><b>${esc(message.author?.displayName || 'unknown')}</b> <span style='color:#9ca3af'>(@${esc(message.author?.username || 'unknown')})</span></div>
      <span title='${timestamp.toLocaleString()}'>${rel < 1 ? 'just now' : rel + 'm ago'}</span>
    </div>
    <div style='font-size:11px;color:#8b93a1;margin-top:2px'>#${esc(message.channel?.name || '')}</div>
    <div class='body'>${md(message.content || '')}</div>
    <div class='chips'>
      ${blocked ? '<button class="btn chip ub">Unblock</button>' : '<button class="btn chip bl" style="background:#3a1316;border-color:#7f1d1d;color:#fecaca">Block</button>'}
      <button class='btn chip fav' style='background:${fav ? '#1e3a8a' : '#1e293b'};border-color:${fav ? '#3b82f6' : '#334155'};color:#bfdbfe'>⭐</button>
      <button class='btn chip hide'>👁️</button>
      <a class='btn chip' href='${message.messageUrl || '#'}' target='_blank'>🌐</a>
      <a class='btn chip' href='discord://-/channels/${message.guild?.id || '@me'}/${message.channel?.id || ''}/${message.id || ''}'>💻</a>
    </div>`;

  node.querySelector('.bl')?.addEventListener('click', () => send({ type: 'blacklist_user', keyword, user: message.author }));
  node.querySelector('.ub')?.addEventListener('click', () => send({ type: 'unblacklist_user', keyword, user: message.author }));
  node.querySelector('.fav')?.addEventListener('click', () => toggleFavorite(message.author));
  node.querySelector('.hide')?.addEventListener('click', () => {
    hidden.add(String(message.id));
    saveHidden();
    node.remove();
  });

  return node;
}

function channelConfigHtml(selected = []) {
  const selectedSet = new Set((selected || []).map(String));
  return channelsSeen.map((channel) => `
    <label style='display:flex;gap:6px'>
      <input class='ch' type='checkbox' value='${attr(channel.id)}' ${selectedSet.has(String(channel.id)) ? 'checked' : ''}/>
      #${esc(channel.name || channel.id)}
    </label>`).join('');
}

function refreshColumnChannelLists() {
  document.querySelectorAll('.col').forEach((columnNode) => {
    const keyword = columnNode.dataset.kw;
    const cfg = keywordConfigs[keyword] || { channels: [] };
    const list = columnNode.querySelector('.chlist');
    if (list) list.innerHTML = channelConfigHtml(cfg.channels || []);
  });
}

function column(keyword) {
  const cfg = keywordConfigs[keyword] || { channels: [], caseSensitive: false, showBlacklisted: false };
  const node = document.createElement('div');
  node.className = 'col';
  node.dataset.kw = keyword;
  node.draggable = true;
  const title = keyword === FAV_COL ? 'Favorites ⭐' : keyword;

  node.innerHTML = `
    <div class='colh'>
      <button class='btn dh'>::</button>
      <div class='title'>${esc(title)}</div>
      <div class='count'>0/30</div>
      <button class='btn opt'>...</button>
      <button class='btn rm' ${keyword === FAV_COL ? 'style="display:none"' : ''}>x</button>
    </div>
    <div class='pop'>
      <label><input class='cs' type='checkbox' ${cfg.caseSensitive ? 'checked' : ''}/> Case sensitive</label><br/>
      <label><input class='sb' type='checkbox' ${cfg.showBlacklisted ? 'checked' : ''}/> Show blocked</label>
      <input class='search' placeholder='Search channels'/>
      <div class='chlist'>${channelConfigHtml(cfg.channels || [])}</div>
      <div style='display:flex;gap:6px;margin-top:8px'><button class='btn all'>All</button><button class='btn clear'>Clear</button></div>
    </div>
    <div class='list'><div class='top-shadow'></div><button class='new-pill'></button></div>`;

  const pop = node.querySelector('.pop');
  node.querySelector('.opt').onclick = (event) => {
    document.querySelectorAll('.pop.open').forEach((p) => p !== pop && p.classList.remove('open'));
    pop.classList.toggle('open');
    event.stopPropagation();
  };
  node.querySelector('.rm').onclick = () => send({ type: 'remove_keyword', keyword });
  node.querySelector('.cs').onchange = (event) => send({ type: 'update_keyword_config', keyword, patch: { caseSensitive: !!event.target.checked } });
  node.querySelector('.sb').onchange = (event) => send({ type: 'update_keyword_config', keyword, patch: { showBlacklisted: !!event.target.checked } });

  const apply = () => send({
    type: 'update_keyword_config',
    keyword,
    patch: { channels: [...node.querySelectorAll('.ch:checked')].map((input) => input.value) }
  });

  node.querySelector('.chlist').addEventListener('change', apply);
  node.querySelector('.search').addEventListener('input', (event) => {
    const query = event.target.value.toLowerCase();
    node.querySelectorAll('.chlist label').forEach((label) => {
      label.style.display = label.textContent.toLowerCase().includes(query) ? 'flex' : 'none';
    });
  });
  node.querySelector('.all').onclick = () => { node.querySelectorAll('.ch').forEach((input) => { input.checked = true; }); apply(); };
  node.querySelector('.clear').onclick = () => { node.querySelectorAll('.ch').forEach((input) => { input.checked = false; }); apply(); };

  let dragEnabled = false;
  node.querySelector('.dh').addEventListener('mousedown', () => { dragEnabled = true; });
  node.addEventListener('dragstart', (event) => {
    if (!dragEnabled) {
      event.preventDefault();
      return;
    }
    node.classList.add('dragging');
  });
  node.addEventListener('dragend', () => {
    dragEnabled = false;
    node.classList.remove('dragging');
    order = [...wrap.querySelectorAll('.col')].map((el) => el.dataset.kw);
    saveOrder();
  });
  node.addEventListener('dragover', (event) => {
    event.preventDefault();
    const dragging = wrap.querySelector('.col.dragging');
    if (!dragging || dragging === node) return;
    const rect = node.getBoundingClientRect();
    wrap.insertBefore(dragging, event.clientX < rect.left + rect.width / 2 ? node : node.nextSibling);
  });

  return node;
}

function getCol(keyword) {
  let node = [...wrap.querySelectorAll('.col')].find((el) => el.dataset.kw === keyword);
  if (!node) {
    node = column(keyword);
    wrap.appendChild(node);
  }
  return node;
}

function updateTopShadow(list) {
  const hasMsg = list.querySelectorAll('.card').length > 0;
  const scrolled = list.scrollTop > 0;
  list.classList.toggle('show-shadow', hasMsg && scrolled);
}

function renderColumns() {
  ensureOrder();
  wrap.querySelectorAll('.col').forEach((col) => {
    if (!keywords.includes(col.dataset.kw)) col.remove();
  });

  order.forEach((keyword) => {
    const cfg = keywordConfigs[keyword] || {};
    const raw = columns[keyword] || [];
    const messages = (cfg.showBlacklisted ? raw : raw.filter((message) => !isBlocked(keyword, message.author?.id)))
      .filter((message) => !hidden.has(String(message.id)));
    const col = getCol(keyword);
    const list = col.querySelector('.list');
    wrap.appendChild(col);

    const pill = list.querySelector('.new-pill') || document.createElement('button');
    pill.className = 'new-pill';
    const shadow = list.querySelector('.top-shadow') || document.createElement('div');
    shadow.className = 'top-shadow';
    list.innerHTML = '';
    list.appendChild(shadow);
    list.appendChild(pill);
    messages.forEach((message) => list.appendChild(card(message, keyword)));
    col.querySelector('.count').textContent = `${messages.length}/30`;
    updateTopShadow(list);
  });

  refreshColumnChannelLists();
}

function queue(message) {
  if (!message?.id || hidden.has(String(message.id))) return;

  if (favorites[message.author?.id]) {
    columns[FAV_COL] = columns[FAV_COL] || [];
    const favMessage = { ...message, keywords: [FAV_COL] };
    columns[FAV_COL].unshift(favMessage);
    columns[FAV_COL].length = Math.min(columns[FAV_COL].length, 30);
    pending.set(FAV_COL, [...(pending.get(FAV_COL) || []), favMessage]);
  }

  (message.keywords || []).forEach((keyword) => {
    if (!keywords.includes(keyword)) return;
    columns[keyword] = columns[keyword] || [];
    columns[keyword].unshift(message);
    columns[keyword].length = Math.min(columns[keyword].length, 30);
    pending.set(keyword, [...(pending.get(keyword) || []), message]);
  });

  if (!timer) timer = setTimeout(flush, 60);
}

function bindPill(keyword, list, pill) {
  if (pill.dataset.b === '1') return;
  pill.dataset.b = '1';
  pill.onclick = () => {
    list.scrollTo({ top: 0, behavior: 'smooth' });
    newCount[keyword] = 0;
    pill.style.display = 'none';
    updateTopShadow(list);
  };
  list.addEventListener('scroll', () => {
    if (list.scrollTop <= 0) {
      newCount[keyword] = 0;
      pill.style.display = 'none';
    }
    updateTopShadow(list);
  });
}

function flush() {
  timer = null;
  for (const [keyword, items] of pending) {
    const col = getCol(keyword);
    const list = col.querySelector('.list');
    const pill = list.querySelector('.new-pill');
    bindPill(keyword, list, pill);
    const away = list.scrollTop > 0;

    for (let i = items.length - 1; i >= 0; i--) {
      const node = card(items[i], keyword);
      if (away) {
        const height = list.scrollHeight;
        list.insertBefore(node, pill.nextSibling);
        list.scrollTop += list.scrollHeight - height;
      } else {
        list.insertBefore(node, pill.nextSibling);
      }
    }

    while (list.querySelectorAll('.card').length > 30) {
      const cards = list.querySelectorAll('.card');
      cards[cards.length - 1].remove();
    }

    if (away) {
      newCount[keyword] = (newCount[keyword] || 0) + items.length;
      pill.style.display = 'inline-block';
      pill.textContent = `${newCount[keyword]} new message(s) - click to top`;
    }

    col.querySelector('.count').textContent = `${list.querySelectorAll('.card').length}/30`;
  }
  pending.clear();
}

function handleKeywordEvent(data) {
  if (Array.isArray(data.keywords)) keywords = data.keywords;
  keywordConfigs = data.keywordConfigs || keywordConfigs;
  if (data.type === 'keyword_added' && data.keyword && !keywords.includes(data.keyword)) keywords.push(data.keyword);
  if (data.type === 'keyword_added' && data.keyword && !columns[data.keyword]) columns[data.keyword] = [];
  if (data.type === 'keyword_removed') delete columns[data.keyword];
  ensureFav();
  renderColumns();
  renderModal();
  renderFavModal();
}

function handleChannelSeen(data) {
  if (data.guilds) guilds = data.guilds;
  else if (data.guild) upsertGuildSeen(data.guild, data.channel);

  if (Array.isArray(data.channelsSeen)) channelsSeen = data.channelsSeen;
  else if (data.channel) upsertChannelSeen(data.channel);

  renderGuildSelect();
  refreshColumnChannelLists();
}

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host);
  showOverlay('Reconnecting...');

  ws.onopen = () => {
    retry = 1000;
    setNavStatus('connected');
    hideOverlay();
    send({ type: 'resync' });
  };
  ws.onerror = () => {
    setNavStatus('error');
    showOverlay('Connection error');
  };
  ws.onclose = () => {
    setNavStatus('disconnected');
    showOverlay('Reconnecting...');
    setTimeout(connect, retry);
    retry = Math.min(retry * 2, 15000);
  };
  ws.onmessage = (event) => {
    let data;
    try { data = JSON.parse(event.data); } catch { return; }

    if (data.type === 'init') {
      keywords = data.keywords || [];
      keywordConfigs = data.keywordConfigs || {};
      columns = data.columns || {};
      guilds = data.guilds || {};
      channelsSeen = data.channelsSeen || [];
      blacklistByKeyword = data.blacklistByKeyword || {};
      if (data.status) setNavStatus(data.status);
      renderGuildSelect();
      ensureFav();
      renderColumns();
      renderModal();
      renderFavModal();
    }
    if (data.type === 'message') queue(data);
    if (data.type === 'keyword_added' || data.type === 'keyword_removed' || data.type === 'keyword_config_updated') handleKeywordEvent(data);
    if (data.type === 'blacklist_updated') {
      blacklistByKeyword = data.blacklistByKeyword || {};
      renderColumns();
      renderModal();
    }
    if (data.type === 'channel_seen' || data.type === 'guild_seen') handleChannelSeen(data);
    if (data.type === 'status' && data.status) setNavStatus(data.status);
    if (data.type === 'health') {
      document.getElementById('health').textContent = `ws:${data.wsClients} last:${data.lastDiscordMessageAt ? Math.floor((Date.now() - data.lastDiscordMessageAt) / 1000) + 's' : '-'}`;
    }
  };
}
