<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiscordDeck</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d0e10; color: #e5e7eb; font-family: Inter, system-ui, sans-serif; }
    header { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #141518; border-bottom: 1px solid #2a2c32; }
    .status-pill { display: flex; align-items: center; gap: 6px; border: 1px solid #2a2c32; background: #1a1c20; color: #e5e7eb; border-radius: 999px; padding: 4px 12px; font-size: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
    .status-pill.connected .status-dot { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,.5); }
    .status-pill.disconnected .status-dot, .status-pill.error .status-dot { background: #ef4444; }
    .right { margin-left: auto; display: flex; gap: 8px; }
    .btn { border: 1px solid #2a2c32; background: #1a1c20; color: #e5e7eb; border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
    .btn:hover { background: #25282f; }
    .main { height: calc(100vh - 56px); display: flex; }
    #wrap { flex: 1; display: flex; gap: 12px; overflow-x: auto; padding: 16px; }
    .col { width: 340px; min-width: 340px; background: #141518; border: 1px solid #2a2c32; border-radius: 12px; display: flex; flex-direction: column; }
    .colh { padding: 12px; border-bottom: 1px solid #2a2c32; display: flex; align-items: center; gap: 8px; }
    .title { font-weight: 600; flex: 1; }
    .count { font-size: 12px; color: #9ca3af; }
    .list { flex: 1; overflow-y: auto; padding: 8px; }
    .card { background: #1b1f26; border: 1px solid #2a2c32; border-radius: 8px; padding: 10px; margin-bottom: 8px; font-size: 13px; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal.open { display: flex; }
    .modal-content { background: #1a1c20; border: 1px solid #2a2c32; border-radius: 12px; width: 420px; max-height: 80vh; overflow: auto; }
    .modal-header { padding: 14px 18px; border-bottom: 1px solid #2a2c32; font-weight: 600; }
    .modal-body { padding: 16px; }
    select, input { width: 100%; padding: 8px; background: #0f1318; border: 1px solid #2a2c32; color: #e5e7eb; border-radius: 6px; margin-bottom: 10px; }
    .guild-list { max-height: 200px; overflow: auto; }
    .guild-item { padding: 8px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; }
    .guild-item:hover { background: #25282f; }
    .guild-item.selected { background: #1e40af; }
  </style>
</head>
<body>
  <header>
    <div id="nav-status" class="status-pill"><div class="status-dot"></div><span id="nav-status-text">connecting</span></div>
    <div class="right">
      <button id="add" class="btn">+ Keyword</button>
      <button id="btn-blacklist" class="btn">Blacklist</button>
      <button id="btn-favorites" class="btn">Favorites</button>
      <button id="btn-clear-hidden" class="btn">Clear Hidden</button>
    </div>
  </header>

  <div class="main">
    <div id="wrap"></div>
  </div>

  <!-- Add Keyword Modal -->
  <div id="add-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">Add Keyword</div>
      <div class="modal-body">
        <input id="kw-input" placeholder="Keyword (e.g. offer)" />
        
        <div id="guild-section">
          <label style="font-size:12px;color:#9ca3af">Guild</label>
          <select id="guild-select"></select>
        </div>

        <div id="channel-section" style="margin-top:12px;display:none">
          <label style="font-size:12px;color:#9ca3af">Channels (select multiple)</label>
          <div id="channel-list" style="max-height:160px;overflow:auto;border:1px solid #2a2c32;border-radius:6px;padding:6px;"></div>
        </div>

        <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">
          <button id="cancel-add" class="btn">Cancel</button>
          <button id="confirm-add" class="btn">Add Keyword</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let ws;
    let keywords = [];
    let keywordConfigs = {};
    let columns = {};
    let guilds = {};
    let channelsSeen = [];
    let blacklistByKeyword = {};
    let favorites = {};
    let hidden = new Set();
    let order = [];

    const FAV_COL = 'favorites';

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onopen = () => {
        document.getElementById('nav-status').className = 'status-pill connected';
        document.getElementById('nav-status-text').textContent = 'connected';
        ws.send(JSON.stringify({ type: 'resync' }));
      };

      ws.onclose = () => {
        document.getElementById('nav-status').className = 'status-pill disconnected';
        document.getElementById('nav-status-text').textContent = 'disconnected';
        setTimeout(connect, 2000);
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        handleMessage(data);
      };
    }

    function handleMessage(data) {
      if (data.type === 'init') {
        keywords = data.keywords || [];
        keywordConfigs = data.keywordConfigs || {};
        columns = data.columns || {};
        guilds = data.guilds || {};
        channelsSeen = data.channelsSeen || [];
        blacklistByKeyword = data.blacklistByKeyword || {};
        renderColumns();
      }
      if (data.type === 'message') {
        queueMessage(data);
      }
      if (data.type === 'keyword_added' || data.type === 'keyword_removed') {
        if (data.keywords) keywords = data.keywords;
        if (data.keywordConfigs) keywordConfigs = data.keywordConfigs;
        renderColumns();
      }
    }

    function renderColumns() {
      const wrap = document.getElementById('wrap');
      wrap.innerHTML = '';
      keywords.forEach(kw => {
        const col = createColumn(kw);
        wrap.appendChild(col);
      });
    }

    function createColumn(kw) {
      const col = document.createElement('div');
      col.className = 'col';
      col.innerHTML = `
        <div class="colh">
          <div class="title">${kw}</div>
          <div class="count">${(columns[kw] || []).length}/30</div>
        </div>
        <div class="list"></div>
      `;
      const list = col.querySelector('.list');
      const msgs = columns[kw] || [];
      msgs.forEach(msg => {
        list.appendChild(createMessageCard(msg, kw));
      });
      return col;
    }

    function createMessageCard(msg, kw) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div><strong>${msg.author?.displayName || msg.author?.username || 'User'}</strong></div>
        <div style="margin-top:4px">${msg.content}</div>
        <div style="font-size:11px;color:#9ca3af;margin-top:6px">${msg.channel?.name || ''}</div>
      `;
      return card;
    }

    // === ADD KEYWORD WITH GUILD SUPPORT ===
    function openAddModal() {
      const modal = document.getElementById('add-modal');
      const guildSelect = document.getElementById('guild-select');
      const channelSection = document.getElementById('channel-section');
      const channelList = document.getElementById('channel-list');

      modal.style.display = 'flex';
      guildSelect.innerHTML = '';

      // Populate guilds
      Object.values(guilds).forEach(guild => {
        const opt = document.createElement('option');
        opt.value = guild.id;
        opt.textContent = guild.name;
        guildSelect.appendChild(opt);
      });

      if (Object.keys(guilds).length === 0) {
        channelSection.style.display = 'none';
      } else {
        channelSection.style.display = 'block';
        updateChannelList();
      }

      guildSelect.onchange = updateChannelList;

      function updateChannelList() {
        const selectedGuildId = guildSelect.value;
        channelList.innerHTML = '';
        const guild = guilds[selectedGuildId];
        if (!guild) return;

        Object.values(guild.channels || {}).forEach(ch => {
          const label = document.createElement('label');
          label.style.display = 'block';
          label.innerHTML = `
            <input type="checkbox" value="${ch.id}" checked> ${ch.name}
          `;
          channelList.appendChild(label);
        });
      }

      document.getElementById('confirm-add').onclick = () => {
        const kw = document.getElementById('kw-input').value.trim().toLowerCase();
        if (!kw) return;

        const selectedGuildId = guildSelect.value || null;
        const selectedChannels = Array.from(channelList.querySelectorAll('input:checked')).map(el => el.value);

        ws.send(JSON.stringify({
          type: 'add_keyword',
          keyword: kw,
          guildId: selectedGuildId,
          channels: selectedChannels
        }));

        modal.style.display = 'none';
        document.getElementById('kw-input').value = '';
      };

      document.getElementById('cancel-add').onclick = () => {
        modal.style.display = 'none';
      };
    }

    // Event listeners
    document.getElementById('add').onclick = openAddModal;

    // Start connection
    connect();
  </script>
</body>
</html>
